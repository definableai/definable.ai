name: Release

# Trigger: pushing a version tag (e.g. v0.9.0).
# Pipeline: build → publish to TestPyPI → smoke-install from TestPyPI → publish to PyPI.
#
# Trusted Publishing (OIDC) — no API tokens stored as secrets. Configure once
# on PyPI / TestPyPI:
#   1. Project settings → Publishing → Add a new pending publisher
#   2. Owner: definableai, repo: definable.ai, workflow: release.yml
#   3. environment: pypi (for prod) and testpypi (for staging)
# See https://docs.pypi.org/trusted-publishers/ for setup.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Build sdist + wheel
        run: python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/definable
    permissions:
      id-token: write   # Required for OIDC trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-test:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for TestPyPI index propagation
        run: sleep 30
      - name: Install from TestPyPI
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "definable==${VERSION}"
      - name: Smoke import
        run: |
          python -c "import definable; from definable import Agent; print('definable', definable.__version__ if hasattr(definable, '__version__') else 'imported ok')"

  publish-pypi:
    needs: smoke-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/definable
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
